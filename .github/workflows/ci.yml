name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest
      - name: 渲染示例并跑质量门
        run: |
          pptforge build examples/sample_spec.yaml -o /tmp/sample.pptx
          python - <<'PY'
          from pptx import Presentation
          from pptforge.gates.checks import run_gates
          report = run_gates(Presentation('/tmp/sample.pptx'))
          assert report.ok, report.issues
          print('质量门通过')
          PY
      - name: 私有泄漏扫描
        run: |
          if grep -RInE "msyh|private_assets|BEGIN (RSA|OPENSSH) PRIVATE KEY" . --exclude-dir=.git; then
            echo "检测到私有/敏感内容，阻断" && exit 1
          fi
      - name: 渲染逐页回看
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice poppler-utils
          soffice --headless --convert-to pdf --outdir /tmp /tmp/sample.pptx
          pdftoppm -png -r 90 /tmp/sample.pdf /tmp/slide
      - name: 上传渲染产物
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ matrix.python-version }}
          path: |
            /tmp/sample.pptx
            /tmp/slide-*.png
