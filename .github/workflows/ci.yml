name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 核心质量门：确定性强、不依赖重型系统包，作为合并阻断（required check）
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest
      - name: 渲染示例并跑质量门
        run: |
          pptforge build examples/sample_spec.yaml -o /tmp/sample.pptx
          python - <<'PY'
          from pptx import Presentation
          from pptforge.gates.checks import run_gates
          report = run_gates(Presentation('/tmp/sample.pptx'))
          assert report.ok, report.issues
          print('质量门通过')
          PY
      - name: 私有泄漏扫描
        run: |
          # 按文件路径检测，避免内容关键词自我命中
          if find . -path ./.git -prune -o \( -iname 'msyh*' -o -iname '*.pem' -o -iname 'id_rsa*' -o -path '*private_assets*' -o -iname '*.key' \) -print | grep -q .; then
            echo "检测到私有字体/资产/私钥文件，阻断"
            find . -path ./.git -prune -o \( -iname 'msyh*' -o -iname '*.pem' -o -iname 'id_rsa*' -o -path '*private_assets*' -o -iname '*.key' \) -print
            exit 1
          fi
          if grep -RIn "PRIVATE KEY" . --exclude-dir=.git --exclude=ci.yml; then
            echo "检测到私钥内容，阻断" && exit 1
          fi
          echo "泄漏扫描通过"

  # 渲染逐页回看：依赖 apt 安装 LibreOffice，环境抖动不得阻断核心质量结论
  render-preview:
    needs: quality
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: 安装LibreOffice并渲染逐页回看
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            -o Acquire::Retries=3 libreoffice-impress poppler-utils
          pptforge build examples/sample_spec.yaml -o /tmp/sample.pptx
          soffice --headless --convert-to pdf --outdir /tmp /tmp/sample.pptx
          pdftoppm -png -r 90 /tmp/sample.pdf /tmp/slide
      - name: 视觉门：check-visual 逐页回看
        run: |
          set -o pipefail
          ROLES="$(python -c 'from pptforge.models import Deck; print(",".join(p.role for p in Deck.load("examples/sample_spec.yaml").pages))')"
          echo "页序 roles: ${ROLES}"
          pptforge check-visual /tmp/slide-*.png --roles "${ROLES}" 2>&1 | tee /tmp/visual-report.txt
      - name: 上传渲染产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-preview
          path: |
            /tmp/sample.pptx
            /tmp/slide-*.png
            /tmp/visual-report.txt

  # 失败工单：阻断 job 失败时，用运行时自带 GITHUB_TOKEN 自动建/更新 issue。
  # 事件驱动、环外，不依赖任何外部 webhook 或密钥。
  failure-ticket:
    name: 失败工单
    needs: [quality, render-preview]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 创建或更新 CI 失败工单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 显式指定仓库：本 job 不 checkout，工作目录不是 git 仓库，
          # 不带 --repo / GH_REPO 时 gh 无法推断目标仓库（历史失败根因）
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          SHORT="$(printf '%s' "$SHA" | cut -c1-7)"
          BR="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ACTOR="${{ github.actor }}"
          LABEL="ci-failure"

          echo "目标仓库：${GH_REPO}"
          gh auth status || true

          if ! gh label create "$LABEL" --description "CI 失败自动工单" 2>/tmp/label.err; then
            echo "标签已存在或创建返回非零：$(cat /tmp/label.err)"
          fi

          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<EOF
          ## CI 失败需要处理
          - 提交：\`${SHORT}\`（${SHA}）
          - 分支：${BR}
          - 触发者：${ACTOR}
          - 运行：${RUN_URL}
          - 阻断 job：quality（ruff/mypy/pytest/静态门/泄漏扫描）

          请按根因修复，禁止 workaround、禁止只删断言；修复后干净环境跑 \`bash scripts/verify.sh\` 全绿，再关闭本工单。
          EOF

          existing="$(gh issue list --state open --label "$LABEL" --search "$SHORT" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "再次失败：${RUN_URL}"
            echo "已更新既有工单 #${existing}"
          else
            if gh issue create --title "CI 失败工单：${SHORT}（${BR}）" --label "$LABEL" --body-file "$BODY_FILE"; then
              echo "已创建带标签失败工单"
            else
              echo "::error::带标签创建失败，退化为无标签工单"
              gh issue create --title "CI 失败工单：${SHORT}（${BR}）" --body-file "$BODY_FILE"
            fi
          fi

  # 关闭已修复工单：质量门全绿时，自动评论并关闭所有 open 的 ci-failure 工单。
  # 与 failure-ticket 互斥（success vs failure），关单动作在 Actions 内完成，不依赖外部表单。
  close-ticket:
    name: 关闭已修复工单
    needs: [quality, render-preview]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 关闭已修复的 CI 失败工单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          nums="$(gh issue list --state open --label ci-failure --json number --jq '.[].number' 2>/dev/null || true)"
          if [ -z "$nums" ]; then
            echo "无待关闭工单"
            exit 0
          fi
          for n in $nums; do
            gh issue comment "$n" --body "已修复并验证全绿：${RUN_URL}"
            gh issue close "$n" --reason completed
            echo "已评论并关闭工单 #${n}"
          done
