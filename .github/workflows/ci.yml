name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 核心质量门：确定性强、不依赖重型系统包，作为合并阻断（required check）
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest
      - name: 渲染示例并跑质量门
        run: |
          pptforge build examples/sample_spec.yaml -o /tmp/sample.pptx
          python - <<'PY'
          from pptx import Presentation
          from pptforge.gates.checks import run_gates
          report = run_gates(Presentation('/tmp/sample.pptx'))
          assert report.ok, report.issues
          print('质量门通过')
          PY
      - name: 私有泄漏扫描
        run: |
          # 按文件路径检测，避免内容关键词自我命中
          if find . -path ./.git -prune -o \( -iname 'msyh*' -o -iname '*.pem' -o -iname 'id_rsa*' -o -path '*private_assets*' -o -iname '*.key' \) -print | grep -q .; then
            echo "检测到私有字体/资产/私钥文件，阻断"
            find . -path ./.git -prune -o \( -iname 'msyh*' -o -iname '*.pem' -o -iname 'id_rsa*' -o -path '*private_assets*' -o -iname '*.key' \) -print
            exit 1
          fi
          if grep -RIn "PRIVATE KEY" . --exclude-dir=.git --exclude=ci.yml; then
            echo "检测到私钥内容，阻断" && exit 1
          fi
          echo "泄漏扫描通过"

  # 渲染逐页回看：依赖 apt 安装 LibreOffice，环境抖动不得阻断核心质量结论
  render-preview:
    needs: quality
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: 安装LibreOffice并渲染逐页回看
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            -o Acquire::Retries=3 libreoffice-impress poppler-utils
          pptforge build examples/sample_spec.yaml -o /tmp/sample.pptx
          soffice --headless --convert-to pdf --outdir /tmp /tmp/sample.pptx
          pdftoppm -png -r 90 /tmp/sample.pdf /tmp/slide
      - name: 视觉门：check-visual 逐页回看
        run: |
          set -o pipefail
          ROLES="$(python -c 'from pptforge.models import Deck; print(",".join(p.role for p in Deck.load("examples/sample_spec.yaml").pages))')"
          echo "页序 roles: ${ROLES}"
          pptforge check-visual /tmp/slide-*.png --roles "${ROLES}" 2>&1 | tee /tmp/visual-report.txt
      - name: 上传渲染产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-preview
          path: |
            /tmp/sample.pptx
            /tmp/slide-*.png
            /tmp/visual-report.txt
