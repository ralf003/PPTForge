[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pptforge"
version = "0.1.0"
description = "声明式工程化 PPT 生产工具链：从声明式 spec 产出本地可编辑 PPTX，工程化质量门兜底"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PPTForge Contributors" }]
keywords = ["pptx", "powerpoint", "presentation", "declarative", "agent"]
dependencies = [
    "python-pptx>=1.0.0",
    "PyYAML>=6.0",
    "Pillow>=12.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "Pillow>=12.1.0",
]

[project.scripts]
pptforge = "pptforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pptforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
